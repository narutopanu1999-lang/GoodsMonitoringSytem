<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 1000px;">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-dark">Chocolate Factory</h1>
            <p class="text-muted fs-5">Welcome to my Shop</p>
            <hr class="w-25 mx-auto">
        </div>

      
        <div class="card shadow-sm mb-5">
            <div class="card-body p-4">
                <h5 class="card-title mb-3">Add New Item</h5>
                <form onsubmit="handleFormSubmit(event)">
                    <div class="row g-3 align-items-end">
                        <div class="col-lg-3 col-md-6">
                            <label for="candy" class="form-label">Candy Name</label>
                            <input type="text" class="form-control" id="candy" name="candy" required>
                        </div>
                        <div class="col-lg-3 col-md-6">
                            <label for="description" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description" name="description" required>
                        </div>
                        <div class="col-lg-2 col-md-4">
                            <label for="price" class="form-label">Price</label>
                            <input type="number" class="form-control" id="price" name="price" min="0" required>
                        </div>
                        <div class="col-lg-2 col-md-4">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" name="quantity" min="0" required>
                        </div>
                        <div class="col-lg-2 col-md-4 d-grid">
                            <button type="submit" class="btn btn-dark">Add Item</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

   
        <h5 class="mb-3">Inventory</h5>
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Candy Name</th>
                            <th>Description</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryBody">
                        
                    </tbody>
                </table>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
